name: Main branch policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dev-only-source:
    name: Main receives dev only
    runs-on: ubuntu-latest
    steps:
      - name: Require the repository dev branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REF" != "dev" || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "main accepts pull requests only from the repository's dev branch."
            exit 1
          fi
