name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows check and build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Install ffmpeg
        run: where ffmpeg >nul 2>nul || choco install ffmpeg --no-progress -y

      - name: Install just
        run: cargo install just --version 1.56.0 --locked

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check
        run: just check

      - name: Build release binary
        run: just build

  linux:
    name: Linux X11 check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xdotool xvfb

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Install just
        run: cargo install just --version 1.56.0 --locked

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check under X11
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" just check

      - name: Build Linux package
        run: bash scripts/package_linux.sh

  macos:
    name: macOS check and build
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install ffmpeg
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Install just
        run: cargo install just --version 1.56.0 --locked

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check
        run: just check

      - name: Build macOS app bundle
        run: bash scripts/package_macos.sh
